# NODE-RED


# Node-RED Pod 1 (the only one exposed to the internet)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dt-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dt-1
  template:
    metadata:
      labels:
        app: dt-1
    spec:
      hostname: dthphwproto  # must match the OPC-UA TLS certificate altname
      containers:
        - name: dt-1
          image: andringitra/dt-debianlinux:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: nodered
              containerPort: 1880   # Node-RED HTTPS port
              hostPort: 1880 #Map to host port for external access
            - name: opcua
              containerPort: 4840   # OPC-UA port
              hostPort: 4880 #Map to host port for external access

